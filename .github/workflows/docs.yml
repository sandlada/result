name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check documentation examples
        run: npm run check:snippets

      - name: Type-check the documentation site
        run: npm run check
        timeout-minutes: 10

      - name: Build (includes link validation)
        run: npm run build
        timeout-minutes: 10

      - name: Verify the build left the working tree clean
        working-directory: .
        run: |
          changes="$(git status --porcelain --untracked-files=all)"

          if [ -n "$changes" ]; then
            echo "::error::The documentation build changed the working tree. Commit the generated version archive or adjust the ignored output paths."
            echo "$changes"
            exit 1
          fi
