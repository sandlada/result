name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the documentation site
        run: pnpm site:verify
        timeout-minutes: 15

      - name: Verify the build left the working tree clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"

          if [ -n "$changes" ]; then
            echo "::error::The documentation build changed the working tree. Commit the generated version archive or adjust the ignored output paths."
            echo "$changes"
            exit 1
          fi
